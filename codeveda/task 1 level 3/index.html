<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Animation Demo</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <header class="hero-spacer">
    <h1>Scroll Down to See the Animation ↓</h1>
  </header>

  <main>
    <section class="scroll-section">
      <div class="content-box">
        <h2 class="title">GSAP ScrollTrigger</h2>
        <p class="description">
          "Hey! Check out this scrolling effect I added. The element slides up and fades in. I made sure to only animate translateY and opacity since the GPU handles those, so the animation is super buttery and hits that smooth 60fps!"
        </p>
        
        <button class="interactive-btn">Hover Me</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
