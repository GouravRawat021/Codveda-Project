

<article
  {# --- ACCESSIBILITY: role="article" --- #}
  {# Tells screen readers: "This is a self-contained piece
     of content." It's like wrapping content in an <article>
     tag (which we're already using), but role makes it
     explicit for ARIA-aware assistive technologies. #}
  role="article"

    <div class="
      w-12 h-12 bg-indigo-50 rounded-lg
      flex items-center justify-center
      text-2xl mb-4
    ">

    </div>

  {# --- TITLE --- #}

  <h3
    id="{{ resolved_id }}-title"
    class="text-lg font-bold text-gray-800 mb-2"
  >
  </h3>

    <p
      id="{{ resolved_id }}-desc"
      class="text-gray-500 text-sm leading-relaxed mb-4"
    >
      {{ description }}
    </p>

    <a
      href="{{ link_url }}"
      class="
        text-indigo-600 text-sm font-semibold
        hover:text-indigo-800 transition-colors
        inline-flex items-center gap-1
      "
    >

      <span aria-hidden="true">&rarr;</span>

    </a>

</article>
